<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; background: #f4f7f6; color: #333; }
    .container { max-width: 1050px; margin: 0 auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    h2 { border-bottom: 3px solid #0056b3; padding-bottom: 15px; color: #0056b3; margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
    .form-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9em; color: #555; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; box-sizing: border-box; }
    input[type=number].no-spin::-webkit-inner-spin-button, input[type=number].no-spin::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number].no-spin { -moz-appearance:textfield; }
    .type-selector { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: nowrap; }
    .type-card { flex: 1 1 0; border: 2px solid #e0e0e0; border-radius: 6px; padding: 8px 4px; text-align: center; cursor: pointer; background: #fff; transition: 0.2s; font-weight: bold; color: #555; min-width: 0; font-size: 0.75em; line-height: 1.25; display: flex; align-items: center; justify-content: center; min-height: 50px; }
    .type-card:hover { border-color: #0056b3; background: #f0f8ff; }
    .type-card.active { border-color: #0056b3; background: #0056b3; color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .vars-section { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 20px; }
    .btn { padding: 12px 24px; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 1em; width: 100%; }
    .btn-calc { background: #28a745; color: white; margin-top: 15px; font-size: 1.1em; }
    .btn-save { background: #0056b3; color: white; font-size: 1.2em; margin-top: 30px; }
    .btn-save:disabled { background: #ccc; cursor: not-allowed; }
    .btn-reset { background: #6c757d; color: white; font-size: 0.8em; padding: 8px 15px; width: auto; }
    .btn-history { background: #6c757d; color: white; font-size: 0.8em; padding: 8px 15px; width: auto; }
    .del-btn { color: #fff; background-color: #dc3545; padding: 4px 8px; border-radius: 4px; cursor: pointer; border: none; font-size: 0.8em;}
    .add-row-btn { background-color: #fff; color: #28a745; border: 1px solid #28a745; border-radius: 50%; width: 24px; height: 24px; font-weight: bold; cursor: pointer; margin-left: 10px; font-size: 14px; line-height: 22px; }
    .add-row-btn:hover { background-color: #28a745; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 0.95em; }
    th { background-color: #0056b3; color: white; padding: 10px; text-align: left; }
    td { border-bottom: 1px solid #ddd; padding: 10px; vertical-align: middle; }
    .price-cell { text-align: right; font-weight: bold; font-family: Consolas, monospace; }
    .stage-row { background-color: #e3f2fd; font-weight: bold; color: #0056b3; border-top: 2px solid #0056b3; }
    .stage-row td { padding: 12px; }
    .hours-input { width: 90px !important; text-align: right; font-weight: bold; font-size: 1.1em; padding: 8px !important; border: 2px solid #007bff !important; border-radius: 4px; }
    .price-input { width: 90px !important; text-align: right; background-color: #eee; color: #555; pointer-events: none; border: 1px solid #ccc !important; }
    .rank-select { width: 350px !important; font-size: 1em; padding: 8px; max-width: 100%; }
    .total-box { margin-top: 30px; background: #fff8e1; padding: 25px; border-radius: 8px; border: 1px solid #ffeeba; }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 1.1em; }
    .total-row.subtotal-line { border-top: 1px solid #ccc; margin-top: 10px; padding-top: 10px; font-weight: bold; }
    .discount-input { text-align: right; width: 150px !important; padding: 8px !important; border: 1px solid #d9534f !important; color: #d9534f; font-weight: bold; }
    .rate-input { width: 60px !important; text-align: right; padding: 5px !important; display: inline-block; margin: 0 5px; }
    .grand-total { color: #d9534f; font-weight: bold; font-size: 2em; display: block; margin-top: 15px; border-top: 2px solid #e6dbb9; padding-top: 15px; text-align: right;}
    .travel-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; background: #f9f9f9; padding: 8px; border-radius: 4px; border: 1px solid #eee; }
    .travel-btn { background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
    .travel-input { padding: 5px !important; font-size: 0.9em !important; border: 1px solid #ccc; border-radius: 4px; }
    .station-input { width: 160px !important; padding: 5px !important; border-radius: 4px; border: 1px solid #ccc; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 700px; height: 80vh; display: flex; flex-direction: column; }
    .modal-search-area { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; }
    .search-result-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; cursor: pointer; align-items: center; }
    .search-result-item:hover { background: #f0f8ff; }
    .list-del-btn { background: #fff; border: 1px solid #dc3545; color: #dc3545; border-radius: 4px; padding: 5px 10px; font-size: 0.8em; cursor: pointer; margin-left: 10px; }
    .check-label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .row-content { display: flex; gap: 5px; align-items: center; flex-wrap: nowrap; white-space: nowrap; }
    [x-cloak] { display: none !important; }
    .loading { text-align: center; padding: 60px; color: #555; font-size: 1.1em; }
    .draft-banner { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9em; }
  </style>
</head>
<body>

<div x-data="app()" x-init="init()" x-cloak class="container">
  <h2>
    見積シミュレーターv4
    <span style="display:flex; gap:8px;">
      <button class="btn btn-reset" @click="resetForm()" style="margin:0;">↻ リセット</button>
      <button class="btn btn-history" @click="openHistory()">📂 履歴呼出</button>
    </span>
  </h2>

  <template x-if="loading">
    <div class="loading">読み込み中...</div>
  </template>

  <template x-if="!loading">
    <div>
      <template x-if="draftRestored">
        <div class="draft-banner">📝 下書きを復元しました</div>
      </template>

      <div class="form-row">
        <div class="form-group">
          <label>顧客名</label>
          <input type="text" x-model="clientName" list="clientListOptions" placeholder="入力すると候補が出ます">
          <datalist id="clientListOptions">
            <template x-for="c in masters.clients" :key="c">
              <option :value="c"></option>
            </template>
          </datalist>
        </div>
        <div class="form-group">
          <label>案件名</label>
          <input type="text" x-model="projectTitle" placeholder="例：全社ワークショップ">
        </div>
      </div>

      <label>▼ 案件タイプを選択</label>
      <div class="type-selector">
        <template x-for="t in types" :key="t.value">
          <div class="type-card" :class="{ active: selectedType === t.value }" @click="selectType(t.value)" x-html="t.label"></div>
        </template>
      </div>

      <div class="vars-section">
        <div x-show="selectedType === 'ws_pharma'">
          <div class="form-group"><label>テーブル数 (1〜17)</label>
            <input type="number" x-model.number="pharmaTableCount" min="1" max="17" style="width:100px;">
          </div>
        </div>
        <div x-show="selectedType === 'ws_normal'">
          <div class="form-row">
            <div class="form-group" style="flex:0 0 150px;">
              <label>テーブル数</label>
              <input type="number" x-model.number="normalTableCount" min="1">
            </div>
            <div class="form-group">
              <label>オプション</label>
              <label class="check-label"><input type="checkbox" x-model="hasFaci"> 当日ファシリあり</label>
              <label class="check-label"><input type="checkbox" x-model="hasMatome"> 取りまとめあり</label>
            </div>
          </div>
        </div>
        <div x-show="selectedType === 'graphic'">
          <div class="form-row"><div class="form-group"><label>人数</label>
            <input type="number" x-model.number="grPeople" min="1">
          </div></div>
        </div>
        <div x-show="selectedType === 'panel'">
          <p style="color:#0056b3; font-weight:bold;">※パネルディスカッション規定のマスタ（固定値）を読み込みます。</p>
        </div>
        <div x-show="selectedType === 'project' || selectedType === 'other'">
          <p style="color:#666;">※すべてのステージと職階を0時間で表示します。必要な箇所を入力してください。</p>
        </div>
        <button class="btn btn-calc" @click="calcDefaultItems()">⬇ 条件を元に明細を自動生成</button>
      </div>

      <table>
        <thead><tr><th width="50"></th><th width="450">ステージ / 業務内容 / 職階</th><th>小計</th></tr></thead>
        <tbody>
          <template x-for="(item, i) in cartItems" :key="i">
            <tr :class="{ 'stage-row': item.isHeader }">
              <td>
                <template x-if="!item.isHeader">
                  <button class="del-btn" @click="removeItem(i)">削除</button>
                </template>
              </td>
              <td>
                <template x-if="item.isHeader">
                  <span>
                    <span x-text="item.eventType"></span>
                    <button class="add-row-btn" @click="addItemToStage(i)">＋</button>
                  </span>
                </template>
                <template x-if="!item.isHeader">
                  <div class="row-content">
                    <template x-if="showRankSelect(item)">
                      <select class="rank-select" @change="updateRank(i, $event.target.value)">
                        <option value="" :selected="!item.rankName">(職階を選択)</option>
                        <template x-for="r in rankList" :key="r">
                          <option :value="r" x-text="r" :selected="r === item.rankName"></option>
                        </template>
                      </select>
                    </template>
                    <template x-if="!showRankSelect(item)">
                      <input type="text" :value="item.rankName" class="rank-select" readonly style="background:#eee; color:#333;">
                    </template>
                    <span>@</span>
                    <input type="number" :value="item.unitPrice" class="price-input" readonly>
                    <span>×</span>
                    <input type="number" x-model.number="item.hours" class="hours-input"><span>h</span>
                    <span style="font-size:0.8em; color:#666; margin-left:3px;" x-text="'(' + ((item.hours||0) / 8).toFixed(2) + '人日)'"></span>
                  </div>
                </template>
              </td>
              <td class="price-cell" x-text="stageOrItemSubtotal(i).toLocaleString()"></td>
            </tr>
          </template>
        </tbody>
      </table>

      <div class="total-box">
        <div class="total-row">
          <span>人件費小計:</span>
          <span>
            <span x-text="laborSumDisplay.toLocaleString()"></span> 円
            <template x-if="selectedType === 'graphic'">
              <span x-text="' (×' + grPeople + '名)'"></span>
            </template>
          </span>
        </div>
        <div class="total-row">
          <span>諸経費 (<input type="number" x-model.number="overheadRate" class="rate-input">%):</span>
          <template x-if="showOverheadNote">
            <span style="color:red; font-size:0.8em; margin-left:10px;">値引く場合は、諸経費の％で、金額調整する（目安10～30%）　特急料金の場合は＋10%目安</span>
          </template>
          <span><span x-text="overheadTotal.toLocaleString()"></span> 円</span>
        </div>
        <div class="total-row subtotal-line"><span>小計:</span><span><span x-text="subTotalA.toLocaleString()"></span> 円</span></div>

        <div style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
          <div style="font-weight:bold; margin-bottom:5px; color:#0056b3;">旅費交通費・宿泊費 詳細</div>
          <template x-for="(t, i) in travelItems" :key="i">
            <div class="travel-row">
              <template x-if="t.type === '交通費'">
                <div style="display:contents;">
                  <span style="font-weight:bold; color:#17a2b8; width:60px;">[交通]</span>
                  <input type="text" placeholder="出発" x-model="t.from" class="station-input">
                  <input type="text" placeholder="到着" x-model="t.to" class="station-input">
                  <button class="travel-btn" @click="searchRoute(i)">🔍</button>
                  <span>片道税込:</span><input type="number" x-model.number="t.priceIn" class="travel-input no-spin" style="width:70px;">
                  <span>×</span> <input type="number" x-model.number="t.count" class="travel-input" style="width:40px;"><span>名</span>
                  <label style="margin-left:5px; font-weight:normal; font-size:0.9em;">
                    <input type="checkbox" x-model="t.isRoundTrip">往復
                  </label>
                  <span style="margin-left:5px;">→ 税抜: <b x-text="travelLineExTax(t).toLocaleString()"></b></span>
                  <button class="del-btn" @click="removeTravelRow(i)" style="margin-left:auto;">×</button>
                </div>
              </template>
              <template x-if="t.type === '宿泊費'">
                <div style="display:contents;">
                  <span style="font-weight:bold; color:#e83e8c; width:60px;">[宿泊]</span>
                  <input type="text" placeholder="宿泊地" x-model="t.place" class="travel-input" style="width:150px;">
                  <span>単価込:</span><input type="number" x-model.number="t.priceIn" class="travel-input no-spin" style="width:70px;">
                  <span>×</span> <input type="number" x-model.number="t.count" class="travel-input" style="width:40px;"><span>泊</span>
                  <span>→ 税抜: <b x-text="travelLineExTax(t).toLocaleString()"></b></span>
                  <button class="del-btn" @click="removeTravelRow(i)" style="margin-left:auto;">×</button>
                </div>
              </template>
            </div>
          </template>
          <div style="margin-top:10px;">
            <button @click="addTravelRow('transport')" style="font-size:0.8em; margin-right:10px; background:#fff; border:1px solid #17a2b8; color:#17a2b8; padding:5px 10px; cursor:pointer; border-radius:4px;">＋ 交通費を追加</button>
            <button @click="addTravelRow('stay')" style="font-size:0.8em; background:#fff; border:1px solid #e83e8c; color:#e83e8c; padding:5px 10px; cursor:pointer; border-radius:4px;">＋ 宿泊費を追加</button>
          </div>
        </div>

        <div class="total-row" style="margin-top:10px; border-top:1px solid #ccc; padding-top:5px;">
          <span>旅費交通費 合計 (税抜):</span><span><span x-text="travelTotal.toLocaleString()"></span> 円</span>
        </div>
        <div class="total-row" style="color:#d9534f; margin-top:10px;">
          <span>出精値引き:</span>
          <div style="display:inline-flex; align-items:center;">
            <span style="font-weight:bold; margin-right:2px; font-size:1.2em;">▲</span>
            <input type="number" x-model.number="discountInput" class="discount-input no-spin" placeholder="0">
          </div>
        </div>
        <div class="total-row" style="border-top:1px dashed #ccc; padding-top:10px;">
          <span>課税対象額:</span><span><span x-text="taxableBase.toLocaleString()"></span> 円</span>
        </div>
        <div class="total-row">
          <span>消費税 (10%):</span><span><span x-text="taxTotal.toLocaleString()"></span> 円</span>
        </div>
        <span class="grand-total">税込総額: <span x-text="grandTotal.toLocaleString()"></span> 円</span>
      </div>

      <button class="btn btn-save" @click="submitData()" :disabled="saving"
        x-text="saving ? '処理中...' : (currentProjectId ? '上書き保存して見積書を更新 (Spreadsheet)' : '保存して見積書を作成 (Spreadsheet)')"></button>

      <template x-if="saveResult">
        <div style="text-align:center;">
          <div style="margin-top:10px; color:#217346; font-weight:bold;" x-text="'✅ ' + saveResult.message"></div>
          <template x-if="saveResult.sheetTotal > 0 && Math.abs(saveResult.sheetTotal - grandTotal) > 10">
            <div style="color:red; font-weight:bold; border:2px solid red; padding:10px; margin-top:10px; background:#fff0f0;">
              ⚠️ 注意：金額不一致<br>
              アプリ計算: <span x-text="grandTotal.toLocaleString()"></span>円<br>
              シート計算: <span x-text="saveResult.sheetTotal.toLocaleString()"></span>円<br>
              ※スプレッドシートを確認してください
            </div>
          </template>
          <div style="margin-top:10px;">
            <a :href="saveResult.url" target="_blank" style="background:#217346; color:white; padding:10px 20px; text-decoration:none; display:inline-block; border-radius:6px; font-weight:bold;">📊 作成された見積書(Sheet)を開く</a>
          </div>
        </div>
      </template>
    </div>
  </template>

  <div class="modal-overlay" x-show="historyOpen" @click.self="historyOpen = false" style="display: flex;" x-cloak>
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0;">履歴からコピー</h3>
        <button @click="historyOpen = false" style="border:none;background:none;font-size:1.5em; cursor:pointer;">×</button>
      </div>
      <div class="modal-search-area">
        <select x-model="filterType" style="flex:1; padding:8px;">
          <option value="">全てのタイプ</option>
          <option value="ws_pharma">ワークショップ(製薬)</option>
          <option value="ws_normal">ワークショップ(製薬以外)</option>
          <option value="graphic">グラフィックレコーディング</option>
          <option value="panel">パネルディスカッション</option>
          <option value="project">イラストのみ</option>
          <option value="other">プロジェクトその他</option>
        </select>
        <input type="text" x-model="filterClient" placeholder="顧客名..." style="flex:1.5; padding:8px;">
        <input type="text" x-model="filterText" placeholder="案件名..." style="flex:1.5; padding:8px;">
      </div>
      <div style="flex:1; overflow-y:auto; border:1px solid #eee;">
        <template x-for="r in filteredHistory" :key="r.id">
          <div class="search-result-item">
            <div style="flex:1" @click="loadProject(r.id)">
              <b x-text="r.title"></b>
              <span style="font-size:0.8em; background:#eee; padding:2px 4px; border-radius:3px; margin-left:5px;" x-text="typeLabel(r.type)"></span>
              <br><small x-text="r.client"></small>
              <br><span style="font-size:0.8em;color:#666;" x-text="r.date + ' ¥' + r.total"></span>
            </div>
            <button class="list-del-btn" @click.stop="confirmDeleteProject(r.id)">削除</button>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
function app() {
  return {
    masters: { clients: [], unitPrices: {}, pharma: [], wsNormal: [], panel: [], templateStructure: [] },
    types: [
      { value: 'ws_pharma',  label: 'ワークショップ<br>(製薬)' },
      { value: 'ws_normal',  label: 'ワークショップ<br>(製薬以外)' },
      { value: 'graphic',    label: 'グラフィック<br>レコーディング' },
      { value: 'panel',      label: 'パネル<br>ディスカッション' },
      { value: 'project',    label: 'イラストのみ' },
      { value: 'other',      label: 'プロジェクト<br>その他' }
    ],
    loading: true,
    saving: false,
    saveResult: null,
    draftRestored: false,
    currentProjectId: '',
    clientName: '',
    projectTitle: '',
    selectedType: 'ws_pharma',
    pharmaTableCount: 1,
    normalTableCount: 1,
    grPeople: 1,
    hasFaci: false,
    hasMatome: false,
    overheadRate: 30,
    discountInput: 0,
    cartItems: [],
    travelItems: [],
    historyOpen: false,
    historyList: [],
    filterType: '',
    filterClient: '',
    filterText: '',
    _saveDraftTimer: null,

    get rankList() { return Object.keys(this.masters.unitPrices); },
    get laborSum() {
      return this.cartItems.filter(i => !i.isHeader)
        .reduce((s,i) => s + (Number(i.unitPrice)||0) * (Number(i.hours)||0), 0);
    },
    get laborSumDisplay() {
      return this.selectedType === 'graphic' ? this.laborSum * (this.grPeople||1) : this.laborSum;
    },
    get overheadTotal() { return Math.floor(this.laborSumDisplay * (this.overheadRate||0) / 100); },
    get subTotalA() { return this.laborSumDisplay + this.overheadTotal; },
    get travelTotal() { return this.travelItems.reduce((s,t) => s + this.travelLineExTax(t), 0); },
    get taxableBase() { return Math.max(0, this.subTotalA + this.travelTotal - (this.discountInput||0)); },
    get taxTotal() { return Math.floor(this.taxableBase * 0.1); },
    get grandTotal() { return this.taxableBase + this.taxTotal; },
    get showOverheadNote() { return !['ws_pharma','graphic'].includes(this.selectedType); },
    get filteredHistory() {
      const tk = this.filterType, ck = this.filterClient.toLowerCase(), tx = this.filterText.toLowerCase();
      return this.historyList.filter(p =>
        (tk ? p.type === tk : true) &&
        (ck ? (p.client||'').toLowerCase().includes(ck) : true) &&
        (tx ? (p.title||'').toLowerCase().includes(tx) : true)
      );
    },
    travelLineExTax(t) {
      if (t.type === '交通費') {
        const mult = t.isRoundTrip ? 2 : 1;
        return Math.round((t.priceIn||0) / 1.1) * mult * (t.count||0);
      }
      return Math.round((t.priceIn||0) / 1.1) * (t.count||0);
    },
    stageOrItemSubtotal(i) {
      const it = this.cartItems[i];
      if (it.isHeader) {
        let sum = 0;
        for (let j = i+1; j < this.cartItems.length; j++) {
          if (this.cartItems[j].isHeader) break;
          sum += (Number(this.cartItems[j].unitPrice)||0) * (Number(this.cartItems[j].hours)||0);
        }
        return sum;
      }
      return (Number(it.unitPrice)||0) * (Number(it.hours)||0);
    },
    showRankSelect(item) {
      return item.rankName === '' || this.masters.unitPrices[item.rankName] !== undefined;
    },
    typeLabel(t) {
      const m = { ws_pharma:'WS(製薬)', ws_normal:'WS(製薬以外)', graphic:'グラレコ', panel:'パネル', project:'PJ', other:'その他' };
      return m[t] || t;
    },

    init() {
      google.script.run
        .withSuccessHandler(data => {
          this.masters = data;
          this.loading = false;
          const restored = this.restoreDraft();
          if (!restored) {
            // 初期表示: 「プロジェクトその他」の明細をデフォルト表示
            this.selectedType = 'other';
            this.overheadRate = 30;
            this.generateFromTemplate();
          }
          this.$watch('cartItems', () => this.saveDraft(), { deep: true });
          this.$watch('travelItems', () => this.saveDraft(), { deep: true });
          this.$watch('clientName', () => this.saveDraft());
          this.$watch('projectTitle', () => this.saveDraft());
          this.$watch('overheadRate', () => this.saveDraft());
          this.$watch('discountInput', () => this.saveDraft());
          this.$watch('selectedType', () => this.saveDraft());
        })
        .withFailureHandler(err => { alert('初期化エラー: ' + err); this.loading = false; })
        .getInitialData();
    },

    saveDraft() {
      clearTimeout(this._saveDraftTimer);
      this._saveDraftTimer = setTimeout(() => {
        try {
          localStorage.setItem('mitsumori_draft_v4', JSON.stringify({
            clientName: this.clientName, projectTitle: this.projectTitle,
            selectedType: this.selectedType, overheadRate: this.overheadRate,
            discountInput: this.discountInput, grPeople: this.grPeople,
            cartItems: this.cartItems, travelItems: this.travelItems,
            currentProjectId: this.currentProjectId, ts: Date.now()
          }));
        } catch (e) { console.warn('autosave failed', e); }
      }, 1500);
    },

    restoreDraft() {
      try {
        const raw = localStorage.getItem('mitsumori_draft_v4');
        if (!raw) return false;
        const d = JSON.parse(raw);
        if (Date.now() - (d.ts||0) > 24*3600*1000) { localStorage.removeItem('mitsumori_draft_v4'); return false; }
        if (!d.clientName && !d.projectTitle && (!d.cartItems || d.cartItems.length === 0)) return false;
        if (!confirm('下書きが見つかりました。復元しますか？\n顧客名: ' + (d.clientName||'(空)') + '\n案件名: ' + (d.projectTitle||'(空)'))) {
          localStorage.removeItem('mitsumori_draft_v4');
          return false;
        }
        this.clientName = d.clientName || '';
        this.projectTitle = d.projectTitle || '';
        this.selectedType = d.selectedType || 'ws_pharma';
        this.overheadRate = d.overheadRate || 30;
        this.discountInput = d.discountInput || 0;
        this.grPeople = d.grPeople || 1;
        this.cartItems = d.cartItems || [];
        this.travelItems = d.travelItems || [];
        this.currentProjectId = d.currentProjectId || '';
        this.draftRestored = true;
        return true;
      } catch (e) { console.warn('restore failed', e); return false; }
    },

    selectType(type) {
      this.selectedType = type;
      this.overheadRate = (type === 'graphic') ? 0 : 30;
    },

    onRankChange(i) {
      const r = this.cartItems[i].rankName;
      this.cartItems[i].unitPrice = this.masters.unitPrices[r] || 0;
    },

    updateRank(i, rankName) {
      this.cartItems[i].rankName = rankName;
      this.cartItems[i].unitPrice = this.masters.unitPrices[rankName] || 0;
    },

    addItemToStage(index) {
      let stage = '';
      for (let k = index; k >= 0; k--) {
        if (this.cartItems[k].isHeader) { stage = this.cartItems[k].eventType; break; }
      }
      this.cartItems.splice(index + 1, 0, {
        isHeader: false, eventType: stage, rankName: '', unitPrice: 0, hours: 0, subtotal: 0
      });
    },
    removeItem(i) { this.cartItems.splice(i, 1); },

    addTravelRow(type) {
      if (type === 'transport') {
        this.travelItems.push({ type: '交通費', from: '', to: '', priceIn: 0, count: 1, isRoundTrip: true });
      } else {
        this.travelItems.push({ type: '宿泊費', place: '', priceIn: 8000, count: 1, isRoundTrip: false });
      }
    },
    removeTravelRow(i) { this.travelItems.splice(i, 1); },

    searchRoute(i) {
      const t = this.travelItems[i];
      if (!t.from || !t.to) { alert('出発地と到着地を入力してください'); return; }
      const q = 'eki1=' + encodeURIComponent(t.from) + '&eki2=' + encodeURIComponent(t.to) + '&Csg=1&rf=nr&S=S';
      window.open('https://www.jorudan.co.jp/norikae/cgi/nori.cgi?' + q, 'jorudan_transit', 'width=800,height=800');
    },

    calcDefaultItems() {
      if (!confirm('現在の明細をクリアして、再生成しますか？')) return;
      this.cartItems = [];
      const type = this.selectedType;
      if (type === 'ws_pharma') {
        this.processMasterData(this.masters.pharma, this.pharmaTableCount + 1);
      } else if (type === 'panel') {
        this.processMasterData(this.masters.panel, 2);
      } else if (type === 'ws_normal') {
        this.generateWSNormal();
      } else if (type === 'graphic') {
        this.cartItems.push({ isHeader:false, eventType:'グラフィックレコーディング', rankName:'基本料金',                 unitPrice:80000, hours:1, subtotal:80000 });
        this.cartItems.push({ isHeader:false, eventType:'グラフィックレコーディング', rankName:'グラフィックレコーディング', unitPrice:20000, hours:2, subtotal:40000 });
        this.cartItems.push({ isHeader:false, eventType:'グラフィックレコーディング', rankName:'待機',                     unitPrice:10000, hours:1, subtotal:10000 });
        this.overheadRate = 0;
      } else {
        this.generateFromTemplate();
      }
    },

    processMasterData(data, colIndex) {
      if (!data || data.length === 0) { alert('マスタエラー'); return; }
      let currentStage = '', lastStage = '';
      data.forEach(row => {
        let stage = row[0];
        const role = row[1];
        if (!stage && lastStage) stage = lastStage;
        if (stage) lastStage = stage;
        if (stage && stage.indexOf('諸経費') > -1) {
          const rate = row[colIndex];
          if (rate) this.overheadRate = rate;
          return;
        }
        if (stage && (stage.indexOf('旅費') > -1 || stage.indexOf('交通費') > -1)) return;
        if (stage && stage !== currentStage) {
          currentStage = stage;
          this.cartItems.push({ isHeader:true, eventType:currentStage, rankName:'', unitPrice:0, hours:0, subtotal:0 });
        }
        if (role) {
          const hours = Number(row[colIndex]) || 0;
          const price = this.masters.unitPrices[role] || 0;
          this.cartItems.push({ isHeader:false, eventType:currentStage, rankName:role, unitPrice:price, hours:hours, subtotal:price*hours });
        }
      });
    },

    generateWSNormal() {
      const data = this.masters.wsNormal;
      if (!data || data.length === 0) { alert('マスタエラー'); return; }
      const colIndex = (this.normalTableCount||1) + 2;
      let currentStage = '', lastStage = '';
      data.forEach(row => {
        let stage = row[0];
        const role = row[1];
        const cond = String(row[2]||'');
        if (cond.indexOf('ファシリ') > -1 && !this.hasFaci) return;
        if ((cond.indexOf('取りまとめ') > -1 || cond.indexOf('とりまとめ') > -1) && !this.hasMatome) return;
        if (!stage && lastStage) stage = lastStage;
        if (stage) lastStage = stage;
        if (stage && stage.indexOf('諸経費') > -1) {
          const rate = row[colIndex];
          if (rate) this.overheadRate = rate;
          return;
        }
        if (stage && (stage.indexOf('旅費') > -1 || stage.indexOf('交通費') > -1)) return;
        if (stage && stage !== currentStage) {
          currentStage = stage;
          this.cartItems.push({ isHeader:true, eventType:currentStage, rankName:'', unitPrice:0, hours:0, subtotal:0 });
        }
        if (role) {
          const hours = Number(row[colIndex]) || 0;
          const price = this.masters.unitPrices[role] || 0;
          this.cartItems.push({ isHeader:false, eventType:currentStage, rankName:role, unitPrice:price, hours:hours, subtotal:price*hours });
        }
      });
    },

    generateFromTemplate() {
      const tpl = this.masters.templateStructure;
      if (!tpl || tpl.length === 0) { alert('テンプレート構造が読み込まれていません。'); return; }
      let currentStage = '';
      tpl.forEach(item => {
        if (item.stage.indexOf('旅費') > -1 || item.stage.indexOf('交通費') > -1) return;
        if (item.stage !== currentStage) {
          currentStage = item.stage;
          this.cartItems.push({ isHeader:true, eventType:currentStage, rankName:'', unitPrice:0, hours:0, subtotal:0 });
        }
        const price = this.masters.unitPrices[item.role] || 0;
        this.cartItems.push({ isHeader:false, eventType:currentStage, rankName:item.role, unitPrice:price, hours:0, subtotal:0 });
      });
    },

    submitData() {
      if (!this.clientName) { alert('顧客名を入力してください'); return; }
      if (this.cartItems.length === 0) { alert('明細がありません'); return; }
      this.saving = true;
      this.saveResult = null;
      const items = this.cartItems.map(it => ({
        eventType: it.eventType,
        hours: it.hours,
        isMedical: it.isMedical || '',
        unitPrice: it.unitPrice,
        rankName: it.rankName,
        subtotal: it.isHeader ? 0 : (Number(it.unitPrice)||0) * (Number(it.hours)||0),
        extraDesc: it.extraDesc || '',
        isHeader: !!it.isHeader
      }));
      const payload = {
        clientName: this.clientName,
        projectTitle: this.projectTitle,
        items: items,
        grandTotal: String(this.grandTotal),
        discountAmount: this.discountInput || 0,
        overheadRate: this.overheadRate,
        travelTotal: this.travelTotal,
        travelDetails: this.travelItems,
        grPeople: this.grPeople,
        projectId: this.currentProjectId,
        selectedType: this.selectedType
      };
      google.script.run
        .withSuccessHandler(res => {
          this.saving = false;
          if (res.success) {
            this.currentProjectId = res.projectId;
            this.saveResult = res;
            localStorage.removeItem('mitsumori_draft_v4');
            this.draftRestored = false;
          } else {
            alert(res.message);
          }
        })
        .withFailureHandler(err => { this.saving = false; alert('保存エラー: ' + err); })
        .saveDataToSheet(payload);
    },

    resetForm() {
      if (!confirm('リセットしますか？')) return;
      this.currentProjectId = '';
      this.clientName = '';
      this.projectTitle = '';
      this.overheadRate = 30;
      this.discountInput = 0;
      this.pharmaTableCount = 1;
      this.normalTableCount = 1;
      this.grPeople = 1;
      this.hasFaci = false;
      this.hasMatome = false;
      this.cartItems = [];
      this.travelItems = [];
      this.saveResult = null;
      this.draftRestored = false;
      localStorage.removeItem('mitsumori_draft_v4');
    },

    openHistory() {
      this.historyOpen = true;
      google.script.run.withSuccessHandler(list => { this.historyList = list || []; }).getRecentProjects();
    },

    loadProject(id) {
      if (!confirm('読み込みますか？')) return;
      google.script.run.withSuccessHandler(data => {
        this.clientName = data.clientName || '';
        this.projectTitle = data.projectTitle || '';
        this.overheadRate = parseFloat(data.overheadRate) || 30;
        this.discountInput = parseFloat(data.discountAmount) || 0;
        this.currentProjectId = '';
        this.selectedType = data.projectType || 'ws_pharma';
        this.cartItems = data.items || [];
        this.travelItems = data.travelDetails || [];
        this.historyOpen = false;
      }).getProjectDetail(id);
    },

    confirmDeleteProject(id) {
      if (!confirm('削除しますか？')) return;
      google.script.run.withSuccessHandler(() => this.openHistory()).deleteProject(id);
    }
  };
}
</script>
